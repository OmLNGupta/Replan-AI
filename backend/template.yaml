AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Replan AI - Cloud-Native Serverless Architecture
  Automated Study Schedule Restoration & Intelligent Workload Rebalancer

Globals:
  Function:
    Timeout: 15
    MemorySize: 512
    Runtime: python3.12
    Tracing: Active
    Environment:
      Variables:
        DYNAMODB_TABLE_NAME: !Ref StudyRecoveryTable
        BEDROCK_MODEL_ID: "us.anthropic.claude-3-5-sonnet-20241022-v2:0"

Resources:
  # ==============================================================================
  # API GATEWAY (HTTP API v2)
  # ==============================================================================
  StudyRecoveryHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Amz-Date
          - X-Api-Key
          - X-Amz-Security-Token
        AllowOrigins:
          - '*'

  # ==============================================================================
  # LAMBDA MICROSERVICE (Python 3.12)
  # ==============================================================================
  StudyRecoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./lambda/
      Handler: app.lambda_handler
      Policies:
        - Statement:
            # Bedrock foundation models and cross-region inference profiles
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - "arn:aws:bedrock:*::foundation-model/*"
                - "arn:aws:bedrock:*:*:inference-profile/*"
            # DynamoDB Single-Table access
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:DescribeTable
              Resource: !GetAtt StudyRecoveryTable.Arn
      Events:
        PostTasks:
          Type: HttpApi
          Properties:
            Path: /tasks
            Method: POST
            ApiId: !Ref StudyRecoveryHttpApi
        GetTasks:
          Type: HttpApi
          Properties:
            Path: /tasks
            Method: GET
            ApiId: !Ref StudyRecoveryHttpApi
        PatchTask:
          Type: HttpApi
          Properties:
            Path: /tasks/{id}
            Method: PATCH
            ApiId: !Ref StudyRecoveryHttpApi
        GeneratePlan:
          Type: HttpApi
          Properties:
            Path: /plan/generate
            Method: POST
            ApiId: !Ref StudyRecoveryHttpApi
        Replan:
          Type: HttpApi
          Properties:
            Path: /plan/replan
            Method: POST
            ApiId: !Ref StudyRecoveryHttpApi
        GetPlan:
          Type: HttpApi
          Properties:
            Path: /plan
            Method: GET
            ApiId: !Ref StudyRecoveryHttpApi

  # ==============================================================================
  # DYNAMODB SINGLE-TABLE (StudyRecoveryTable)
  # ==============================================================================
  StudyRecoveryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: StudyRecoveryTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

Outputs:
  HttpApiUrl:
    Description: "URL of the HTTP API Gateway endpoint"
    Value: !Sub "https://${StudyRecoveryHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  LambdaFunctionArn:
    Description: "ARN of the Replan AI Lambda Function"
    Value: !GetAtt StudyRecoveryFunction.Arn
  DynamoDBTableArn:
    Description: "ARN of the DynamoDB Single-Table"
    Value: !GetAtt StudyRecoveryTable.Arn
